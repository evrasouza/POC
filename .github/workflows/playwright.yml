name: Playwright Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  quality-checks:
    name: Quality Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript check
        run: npm run typecheck

      - name: Run unit tests
        run: npm run test:unit

  playwright-smoke:
    name: Playwright Smoke - ${{ matrix.brand }} ${{ matrix.country }}/${{ matrix.language }}
    runs-on: ubuntu-latest
    needs: quality-checks

    strategy:
      fail-fast: false
      matrix:
        include:
          - brand: canam-offroad
            country: ca
            language: en

          - brand: canam-onroad
            country: ca
            language: en

          - brand: seadoo
            country: ca
            language: en

          - brand: skidoo
            country: ca
            language: en

          - brand: lynx
            country: ca
            language: en

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run smoke tests
        run: >
          npm run test:smoke --
          --brand=${{ matrix.brand }}
          --country=${{ matrix.country }}
          --language=${{ matrix.language }}

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.brand }}-${{ matrix.country }}-${{ matrix.language }}
          path: playwright-report/
          retention-days: 14

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.brand }}-${{ matrix.country }}-${{ matrix.language }}
          path: test-results/
          retention-days: 14
